<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1976d2">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traspasos y pedidos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/index.css">
</head>
<body class="bg-light">

  <div class="container py-4" id="inicio">
    <div id="seccion-modo" class="mb-4">
      <h4 class="text-center text-primary mb-3">¿Qué deseas hacer?</h4>
      <p class="text-center text-muted small mb-4">Bodegas: elige si surtes un pedido (Excel de sucursal) o revisas un traspaso / pedido ya en formato SICAR.</p>
      <div class="row g-3">
        <div class="col-md-6">
          <button type="button" id="btn-modo-pedido" class="btn btn-outline-primary w-100 py-4 h-100">
            <i class="bi bi-cart-plus d-block fs-2 mb-2"></i>
            <strong>Hacer pedido</strong>
            <span class="d-block text-muted small mt-2">Excel con CLAVE, DESCRIPCIÓN y CANT (número). La cantidad se edita completa.</span>
          </button>
        </div>
        <div class="col-md-6">
          <button type="button" id="btn-modo-revision" class="btn btn-outline-success w-100 py-4 h-100">
            <i class="bi bi-clipboard-check d-block fs-2 mb-2"></i>
            <strong>Revisar pedido / traspaso</strong>
            <span class="d-block text-muted small mt-2">Excel o PDF SICAR. CANT tipo 1.000PZA: solo editable la parte antes del punto.</span>
          </button>
        </div>
      </div>
    </div>

    <div id="seccion-flujo" style="display: none;">
      <p id="modo-activo-label" class="text-center small fw-semibold text-secondary mb-1"></p>
      <button type="button" id="btn-cambiar-modo" class="btn btn-link btn-sm d-block mx-auto mb-3">Cambiar tipo de operación</button>

      <h4 id="titulo-flujo" class="mb-4 text-center text-success">Cargar archivo</h4>

      <!-- Sección de Input -->
      <div id="seccion-input">
        <div class="mb-3">
          <label for="tipo-archivo">Selecciona tipo de archivo:</label>
          <select id="tipo-archivo" class="form-select mb-3">
            <option value="">-- Seleccionar --</option>
            <option value="excel">Excel</option>
            <option value="pdf" id="opcion-pdf">PDF</option>
          </select>

          <div id="pdf" style="display: none;">
            <label for="input-pdf">Cargar PDF de Traspaso:</label>
            <input type="file" id="input-pdf" class="form-control" accept=".pdf" />
            <div id="file-name-pdf" class="mt-2 text-secondary small"></div>
          </div>

          <div id="excel" style="display: none;">
            <label for="input-excel">Cargar EXCEL de Traspaso:</label>
            <input type="file" id="input-excel" class="form-control" accept=".xlsx" />
            <div id="file-name-excel" class="mt-2 text-secondary small"></div>
          </div>
        </div>
        <div class="d-grid">
          <button id="btn-cargar" onclick="ocultarInput()" class="btn btn-success" style="display: none;">Cargar datos</button>
        </div>
      </div>

      <!-- Sección de Filtro -->
      <div class="mb-3" id="seccion-filtro">
        <input type="text" id="searchInput" class="form-control" placeholder="Buscar por nombre o clave..." />
      </div>

      <!-- Sección de Filtro de todo -->
      <div class="mb-3 position-relative" id="seccion-filtroTodo">
        <input type="text" id="searchInputTodo" class="form-control" placeholder="Buscar por nombre o clave..." />
      </div>

      <!-- Tabla -->
      <div id="tabla-contenedor" class="table-responsive mt-3"></div>
    </div>
  </div>

  <div id="resumen-final"></div>

  <div id="boton-container" class="text-center mt-3"></div>

  <div class="text-center mt-4" id="limpiar-container">
    <button id="btn-limpiar" class="btn btn-danger" onclick="ocultarLimpiar()">Cargar archivo nuevo</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
  <script>
    if (typeof pdfjsLib !== "undefined") {
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.worker.min.js";
    }
  </script>
  <script src="js/index.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
